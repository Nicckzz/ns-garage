      --purple-glow:rgba(124,58,237,0.18);

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;line-height:1.6;overflow-x:hidden;}

    .nav-links{display:flex;gap:28px;list-style:none;}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:0.82rem;font-weight:500;letter-spacing:1px;text-transform:uppercase;transition:color 0.2s;}
    .nav-links a:hover{color:var(--white);}
    .nav-cta{background:var(--purple);color:#fff!important;padding:9px 18px;border-radius:6px;font-size:0.82rem;font-weight:600;text-decoration:none;transition:background 0.2s;white-space:nowrap;}
    .nav-cta:hover{background:var(--purple-light)!important;}
    .lang-switch{display:flex;gap:4px;}
    .lang-btn{background:none;border:none;font-size:1.2rem;padding:4px 6px;border-radius:5px;cursor:pointer;opacity:0.6;transition:all .2s;}
    .lang-btn:hover{opacity:1;}
    .lang-btn.active{background:var(--purple);opacity:1;}
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px;}
    .hamburger span{display:block;width:24px;height:2px;background:var(--white);border-radius:2px;}

    .page-hero{padding:130px 5% 60px;text-align:center;position:relative;overflow:hidden;}
    .page-hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 100%,rgba(124,58,237,0.1) 0%,transparent 70%);pointer-events:none;}
    .eyebrow{font-size:0.72rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--purple-light);margin-bottom:12px;}
    .page-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.5rem,6vw,4.5rem);letter-spacing:2px;margin-bottom:16px;}
    .page-sub{color:var(--muted);font-size:0.95rem;max-width:500px;margin:0 auto;}


    /* SERVICE IMAGE */
    .scard-img { width:100%; height:180px; background:var(--bg3); border-bottom:1px solid var(--border); position:relative; overflow:hidden; cursor:pointer; }
    .scard-img img { width:100%; height:100%; object-fit:cover; object-position:center center; display:block; }
    .scard-img-placeholder { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
    .scard-img-placeholder span:first-child { font-size:2rem; opacity:0.3; }
    .scard-img-placeholder span:last-child { font-size:0.72rem; color:var(--muted); letter-spacing:1px; text-transform:uppercase; opacity:0.5; }

    /* VEHICLE TOGGLE */
    .vehicle-bar{display:flex;justify-content:center;gap:8px;padding:40px 5% 0;flex-wrap:wrap;}
    .v-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:600;padding:10px 28px;border-radius:8px;cursor:pointer;transition:all 0.2s;}
    .v-btn.active{background:var(--purple);border-color:var(--purple);color:#fff;}
    .v-btn:hover:not(.active){border-color:var(--purple);color:var(--white);}

    /* CARDS */
    .services-wrap{padding:50px 5% 100px;max-width:1200px;margin:0 auto;}
    .services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;}

    .scard{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:border-color 0.3s,transform 0.3s;display:flex;flex-direction:column;}
    .scard:hover{border-color:var(--purple);transform:translateY(-4px);}
    .scard-top{padding:28px 28px 20px;border-bottom:1px solid var(--border);}
    .scard-icon{font-size:2rem;margin-bottom:12px;display:block;}
    .scard-name{font-family:'Bebas Neue',sans-serif;font-size:1.55rem;letter-spacing:1px;margin-bottom:8px;}
    .scard-note{margin-top:12px;padding:10px 12px;border:1px solid rgba(168,85,247,0.35);background:rgba(124,58,237,0.1);border-radius:8px;color:var(--white);font-size:0.8rem;line-height:1.5;}
    .consult-text{color:var(--muted);font-size:0.85rem;line-height:1.6;padding-top:6px;}
    .consult-actions{display:flex;gap:10px;padding:0 28px 28px;}
    .consult-actions .scard-cta{flex:1;margin:0;text-align:center;}
    .scard-cta.wa{background:#25d366;color:#04210f;}
    .scard-cta.call{background:var(--bg3);border:1px solid var(--border);color:var(--white);}
    .scard-desc{color:var(--muted);font-size:0.87rem;line-height:1.7;}

    .options-title{font-size:0.7rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--purple-light);margin-bottom:10px;}
    .opt-row{display:flex;flex-wrap:wrap;gap:8px;}
    .opt-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:0.78rem;font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif;}
    .opt-btn.active{background:var(--purple);border-color:var(--purple);color:#fff;}
    .opt-btn:hover:not(.active){border-color:var(--purple);color:var(--white);}

    .check-row{display:flex;flex-direction:column;gap:8px;}
    .check-item{display:flex;align-items:center;gap:10px;cursor:pointer;}
    .check-item input{accent-color:var(--purple);width:16px;height:16px;cursor:pointer;}
    .check-item label{font-size:0.85rem;color:var(--muted);cursor:pointer;}

    /* PRICING */
    .scard-pricing{padding:20px 28px;flex:1;}
    .pricing-label{font-size:0.7rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
    .price-rows{display:flex;flex-direction:column;gap:0;}
    .price-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
    .price-row:last-child{border-bottom:none;}
    .price-vehicle{display:flex;align-items:center;gap:8px;font-size:0.87rem;color:var(--muted);}
    .price-val{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;color:#555;transition:color 0.2s,font-size 0.2s;}
    .price-val.highlight{color:var(--purple-light);font-size:1.5rem;}

    .scard-cta{display:block;margin:16px 28px 24px;text-align:center;background:var(--purple);color:#fff;padding:12px;border-radius:8px;font-weight:600;font-size:0.9rem;text-decoration:none;transition:background 0.2s;}
    .scard-cta:hover{background:var(--purple-light);}

    .page-note{text-align:center;padding:0 5% 60px;color:var(--muted);font-size:0.85rem;max-width:600px;margin:0 auto;}
    .page-note strong{color:var(--purple-light);}

    footer{background:#080808;border-top:1px solid var(--border);padding:40px 5%;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}

    .footer-logo span{color:var(--purple-light);}
    .footer-copy{font-size:0.8rem;color:var(--muted);}

      .hamburger{display:flex;}
      .nav-cta{display:none;}
      footer{flex-direction:column;text-align:center;}
    }
  </style>
</head>

const L = () => I18N[currentLang];

function setLang(lang) {
  if (!I18N[lang]) return;
  currentLang = lang;
  try { localStorage.setItem('nsLang', lang); } catch(e){}
  document.documentElement.lang = lang === 'pt' ? 'pt-PT' : lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = L()[el.dataset.i18n]; if (v !== undefined) el.textContent = v;
  });
  document.getElementById('pageNote').innerHTML = L().note;
  ['pt','en','es'].forEach(l => document.getElementById('btn-'+l).classList.toggle('active', l===lang));
  renderAll();
}

    type: 'options',
    options: [
      { label: 'Interior + Exterior', pricing: { coupe: '€90', sedan: '€100', suv: '€110', truck: '€110', van1: '€100', van2: '€110', van3: '€120' } },
      { label: 'Interior', pricing: { coupe: '€55', sedan: '€60', suv: '€65', truck: '€65', van1: '€65', van2: '€65', van3: '€65' } },
      { label: 'Exterior', pricing: { coupe: '€55', sedan: '€60', suv: '€65', truck: '€65', van1: '€65', van2: '€65', van3: '€65' } },
    ],
    defaultOption: 0
  },
  {
    id: 'headlight',
    icon: '💡',
    name: 'Headlight Restoration',
    desc: 'Multi-stage sanding and polishing to restore yellowed or oxidized headlights to full clarity and brightness.',
    pricing: { coupe: '€50', sedan: '€50', suv: '€50', truck: '€50', van1: '€50', van2: '€50', van3: '€50' }
  },
  {
    id: 'shampoo',
    icon: '🧴',
    name: 'Shampoo Detailing',
    desc: 'Deep cleaning of upholstery using hot water extraction and steam. Select which areas you need treated.',
    type: 'shampoo',
    items: [
      { label: 'Front Seats',     prices: { coupe: 20, sedan: 20, suv: 20, truck: 20, van1: 20, van2: 20, van3: 20 } },
      { label: 'Rear Seats',      prices: { coupe: 30, sedan: 30, suv: 30, truck: 30, van1: 30, van2: 30, van3: 30 } },
      { label: 'Carpet / Floor',  prices: { coupe: 30, sedan: 30, suv: 30, truck: 30, van1: 30, van2: 30, van3: 30 } },
      { label: 'Roof Lining',     prices: { coupe: 30, sedan: 30, suv: 30, truck: 30, van1: 30, van2: 30, van3: 30 } },
      { label: 'Trunk / Cargo',   prices: { coupe: 30, sedan: 30, suv: 30, truck: 30, van1: 30, van2: 30, van3: 30 } },
    ]
  },
  {
    id: 'tinting',
    icon: '🔮',
    name: 'Window Tinting',
    type: 'consult'
  },
  {
    id: 'polish',
    icon: '🪄',
    name: 'Polish / Paint Correction',
    type: 'consult'
  },
  {
    id: 'ceramic',
    icon: '💎',
    name: 'Ceramic Coating Package',
    type: 'consult'
  }
];

// State
const state = {};
SERVICES.forEach(s => {
  if (s.type === 'options') state[s.id] = s.defaultOption;
  if (s.type === 'shampoo') state[s.id] = [];
});

const cargoState = {};
function toggleCargo(id, on) { cargoState[id] = !!on; renderAll(); }

const isVanGroup = () => currentVehicle === 'van';
const rowKeys = () => isVanGroup() ? ['van1','van2','van3'] : ['coupe','sedan','suv','truck'];
const curKey = () => isVanGroup() ? 'van1' : currentVehicle;

function setVehicle(v, btn) {
  currentVehicle = v;
  document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function setOption(id, idx) {
  state[id] = idx;
  renderAll();
}

function toggleShampoo(id, idx) {
  const arr = state[id];
  const i = arr.indexOf(idx);
  if (i === -1) arr.push(idx); else arr.splice(i, 1);
  updateShampooPrice(id);
}

function updateShampooPrice(id) {
  const s = SERVICES.find(x => x.id === id);
  const total = state[id].reduce((sum, idx) => sum + s.items[idx].prices[curKey()], 0);
  const el = document.getElementById('shampoo-price-' + curKey());
  if (el) el.textContent = total > 0 ? '€' + total : '€0';
  // update all vehicle prices
  ['coupe','sedan','suv','truck','van1','van2','van3'].forEach(v => {
    const t = state[id].reduce((sum, idx) => sum + s.items[idx].prices[v], 0);
    const e = document.getElementById('shampoo-price-' + v);
    if (e) e.textContent = t > 0 ? '€' + t : '€0';
  });
}

function renderAll() {
  const grid = document.getElementById('grid');
  grid.innerHTML = SERVICES.map(s => renderCard(s)).join('');
  // Re-attach shampoo listeners
  SERVICES.filter(s => s.type === 'shampoo').forEach(s => {
    s.items.forEach((item, idx) => {
      const cb = document.getElementById('cb-' + s.id + '-' + idx);
      if (cb) {
        cb.checked = state[s.id].includes(idx);
        cb.addEventListener('change', () => { toggleShampoo(s.id, idx); });
      }
    });
  });
}

function renderCard(s) {
  const cargoOn = !!(s.cargoAddon && (currentVehicle === 'truck' || currentVehicle === 'van') && cargoState[s.id]);
  const adj = (v, p) => (cargoOn && (v === 'truck' || v.startsWith('van')) && /^€\d+$/.test(p)) ? '€' + (parseInt(p.slice(1), 10) + 20) : p;
  const cargoHTML = (s.cargoAddon && (currentVehicle === 'truck' || currentVehicle === 'van')) ? `
      <div class="scard-options"><div class="check-row"><div class="check-item">
        <input type="checkbox" id="cargo-${s.id}" ${cargoState[s.id]?'checked':''} onchange="toggleCargo('${s.id}',this.checked)">
        <label for="cargo-${s.id}">${L().cargo_label} <span style="color:var(--purple-light);font-size:0.8rem">(+€20)</span></label>
      </div></div></div>` : '';
  let optionsHTML = '';
  let pricingHTML = '';

  if (s.type === 'options') {
    const sel = state[s.id];
    optionsHTML = `
      <div class="scard-options">
        <div class="options-title">${L().select_type}</div>
        <div class="opt-row">
          ${s.options.map((o,i) => `<button class="opt-btn ${i===sel?'active':''}" onclick="setOption('${s.id}',${i})">${(L().svc[s.id].opts||[])[i]||o.label}</button>`).join('')}
        </div>
      </div>`;
    const prices = s.options[sel].pricing;
    pricingHTML = Object.entries(prices).filter(([v]) => rowKeys().includes(v)).map(([v, p0]) => { const p = p0==='Quote' ? L().quote : adj(v, p0); return `
      <div class="price-row">
        <div class="price-vehicle">${VEHICLES[v]}</div>
        <div class="price-val ${v===currentVehicle?'highlight':''}">${p}</div>
      </div>`; }).join('');
  } else if (s.type === 'consult') {
    const waMsg = encodeURIComponent(L().wa_msg + ' ' + L().svc[s.id].name);
    return `
    <div class="scard">
      <div class="scard-img">
        ${SERVICE_IMAGES[s.id] ? `<img loading="lazy" decoding="async" src="${SERVICE_IMAGES[s.id]}" alt="${L().svc[s.id].name}" />` : `<div class="scard-img-placeholder"><span>${s.icon}</span><span>${L().add_photo}</span></div>`}
      </div>
      <div class="scard-top">
        <span class="scard-icon">${s.icon}</span>
        <div class="scard-name">${L().svc[s.id].name}</div>
        <p class="scard-desc">${L().svc[s.id].desc}</p>
      </div>
      <div class="scard-pricing">
        <div class="pricing-label">${L().quote}</div>
        <p class="consult-text">${L().consult_msg}</p>
      </div>
      <div class="consult-actions">
        <a href="https://wa.me/351912881521?text=${waMsg}" target="_blank" class="scard-cta wa">WhatsApp</a>
        <a href="tel:+351912881521" class="scard-cta call">${L().call_btn}</a>
      </div>
    </div>`;
  } else if (s.type === 'shampoo') {
    optionsHTML = `
      <div class="scard-options">
        <div class="options-title">${L().select_areas}</div>
        <div class="check-row">
          ${s.items.map((item, idx) => `
            <div class="check-item">
              <input type="checkbox" id="cb-${s.id}-${idx}" ${state[s.id].includes(idx)?'checked':''}>
              <label for="cb-${s.id}-${idx}">${L().svc[s.id].items[idx]} <span style="color:var(--purple-light);font-size:0.8rem">(+€${item.prices[curKey()]})</span></label>
            </div>
          `).join('')}
        </div>
      </div>`;
    pricingHTML = rowKeys().map(v => {
      const total = state[s.id].reduce((sum, idx) => sum + s.items[idx].prices[v], 0);
      return `
        <div class="price-row">
          <div class="price-vehicle">${VEHICLES[v]}</div>
          <div class="price-val ${v===currentVehicle?'highlight':''}" id="shampoo-price-${v}">${total > 0 ? '€'+total : '€0'}</div>
        </div>`;
    }).join('');
  } else {
    pricingHTML = Object.entries(s.pricing).filter(([v]) => rowKeys().includes(v)).map(([v, p]) => `
      <div class="price-row">
        <div class="price-vehicle">${VEHICLES[v]}</div>
        <div class="price-val ${v===currentVehicle?'highlight':''}">${p==='Quote'?L().quote:adj(v,p)}</div>
      </div>`).join('');
  }

  return `
    <div class="scard">
      <div class="scard-img">
        ${SERVICE_IMAGES[s.id]
          ? `<img loading="lazy" decoding="async" src="${SERVICE_IMAGES[s.id]}" alt="${L().svc[s.id].name}" />`
          : `<div class="scard-img-placeholder"><span>${s.icon}</span><span>${L().add_photo}</span></div>`
        }
      </div>
      <div class="scard-top">
        <span class="scard-icon">${s.icon}</span>
        <div class="scard-name">${L().svc[s.id].name}</div>
        <p class="scard-desc">${L().svc[s.id].desc}</p>
        ${L().svc[s.id].note ? `<p class="scard-note">⚠️ ${L().svc[s.id].note}</p>` : ''}
      </div>
      ${optionsHTML}${cargoHTML}
      <div class="scard-pricing">
        <div class="pricing-label">${L().pricing_label}</div>
        <div class="price-rows">${pricingHTML}</div>
      </div>
      <a href="index.html#booking" class="scard-cta">${L().book_cta}</a>
    </div>`;
}

setLang(currentLang);

document.getElementById('hamburger').addEventListener('click', () =>
  document.getElementById('navLinks').classList.toggle('open'));
</script>
</body>
</html>
