<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NS Agenda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NS Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
:root{--bg:#0d0d0d;--bg2:#141414;--bg3:#1a1a1a;--purple:#7c3aed;--pl:#a855f7;--white:#f5f5f5;--muted:#8a8a8a;--border:rgba(255,255,255,.08);--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--glow:rgba(124,58,237,.18)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--white);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background-image:radial-gradient(ellipse 80% 40% at 50% -5%,var(--glow),transparent 70%);background-repeat:no-repeat;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font:inherit;color:var(--white)}
.hidden{display:none!important}
.display{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;letter-spacing:1px;font-weight:400}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse 70% 50% at 50% 35%,rgba(124,58,237,.22),transparent 70%)}
.login-wrap{width:100%;max-width:380px;text-align:center}
.login-logo{width:min(300px,78vw);height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 0 22px rgba(124,58,237,.45))}
.login-tag{font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--pl);margin-bottom:26px}
.card{background:rgba(20,20,20,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;text-align:left;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-size:1.9rem;margin-bottom:2px}.card p.sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
.field{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:16px;transition:border-color .2s,box-shadow .2s}
.field:focus{outline:none;border-color:var(--pl);box-shadow:0 0 0 3px rgba(168,85,247,.18)}
.btn{background:linear-gradient(135deg,var(--purple),#6d28d9);color:#fff;border-radius:12px;padding:14px 16px;font-weight:700;width:100%;transition:transform .15s,box-shadow .2s,filter .2s;box-shadow:0 6px 20px rgba(124,58,237,.3)}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--bg3);border:1px solid var(--border);box-shadow:none}
.err{color:var(--bad);font-size:.85rem;margin-top:8px;min-height:1em}
/* app */
header{position:sticky;top:0;z-index:20;background:rgba(13,13,13,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:30px;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(124,58,237,.5))}
.brand span{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:1.25rem;letter-spacing:2px;color:var(--white);line-height:1}
header .actions{display:flex;gap:8px}
.icon-btn{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:.82rem;font-weight:500;transition:border-color .2s,background .2s}
.icon-btn:active{background:var(--purple);border-color:var(--purple)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 0;max-width:760px;margin:0 auto}
.stat{background:linear-gradient(160deg,var(--bg2),#101010);border:1px solid var(--border);border-radius:14px;padding:10px 12px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pl);opacity:.8}
.stat b{display:block;font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:1.9rem;line-height:1;letter-spacing:1px}
.stat small{color:var(--muted);font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin:14px 16px 0;padding:4px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;max-width:728px}
@media(min-width:792px){.tabs{margin-left:auto;margin-right:auto;width:728px}}
.tab{flex:1;padding:10px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.88rem;transition:all .2s}
.tab.active{background:linear-gradient(135deg,var(--purple),#6d28d9);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.35)}
.filters{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--bg2);border:1px solid var(--border);color:var(--muted);font-size:.8rem;font-weight:500;transition:all .2s}
.chip.active{border-color:var(--pl);color:var(--white);background:rgba(168,85,247,.14)}
main{padding:0 16px 90px;max-width:760px;margin:0 auto}
.item{background:linear-gradient(160deg,var(--bg2),#101010);border:1px solid var(--border);border-radius:16px;padding:14px 14px 14px 17px;margin-bottom:10px;position:relative;overflow:hidden;transition:transform .15s,border-color .2s;animation:rise .35s ease both}
.item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--muted)}
.item.st-pending:before{background:var(--warn)}.item.st-confirmed:before{background:var(--pl)}.item.st-done:before{background:var(--ok)}.item.st-cancelled:before{background:var(--bad)}
.item:active{transform:scale(.985);border-color:var(--pl)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.item .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item .top>div:first-child{flex:1;min-width:0}
.item .name{font-weight:700;font-size:1rem}
.item .meta{color:var(--muted);font-size:.82rem;margin-top:3px}
.item .when{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;letter-spacing:1px;color:var(--pl);font-size:1.1rem;text-align:right;line-height:1.2;flex-shrink:0;max-width:46%}
.item .when .badge{font-family:'DM Sans',sans-serif;margin-top:4px}
.badge{display:inline-block;font-size:.65rem;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.8px}
.s-pending{background:rgba(245,158,11,.15);color:var(--warn)}.s-confirmed{background:rgba(124,58,237,.22);color:var(--pl)}
.s-done{background:rgba(34,197,94,.15);color:var(--ok)}.s-cancelled{background:rgba(239,68,68,.15);color:var(--bad)}
.new-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;box-shadow:0 0 0 0 rgba(239,68,68,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0 12px}
.cal-head .t{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:1.5rem;letter-spacing:1.5px;}
.cal-head .t::first-letter{text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dn{text-align:center;color:var(--muted);font-size:.7rem;padding:4px 0;letter-spacing:1px}
.day{aspect-ratio:1;background:var(--bg2);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.88rem;gap:3px;transition:all .15s}
.day.empty{background:none;border:none;padding:0}.day.today{border-color:var(--pl);box-shadow:0 0 0 1px var(--pl) inset,0 0 14px rgba(168,85,247,.25)}
.day.sel{background:linear-gradient(135deg,var(--purple),#6d28d9);border-color:var(--purple);box-shadow:0 4px 14px rgba(124,58,237,.4)}
.day .dot{font-size:.62rem;font-weight:700;color:var(--pl)}.day.sel .dot{color:#fff}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-body{background:var(--bg2);border-top-left-radius:24px;border-top-right-radius:24px;width:100%;max-width:760px;max-height:92vh;overflow-y:auto;padding:12px 18px calc(24px + env(safe-area-inset-bottom));border:1px solid var(--border);box-shadow:0 -20px 60px rgba(124,58,237,.12);animation:slide .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-body:before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:0 auto 14px}
.sheet-body h2{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;letter-spacing:1px;font-weight:400;font-size:1.7rem!important}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.row span:first-child{color:var(--muted)}.row span:last-child{text-align:right;word-break:break-word}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.grid2 .btn{padding:13px 8px;font-size:.88rem}
.ok{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 6px 20px rgba(34,197,94,.25)}.bad{background:rgba(239,68,68,.14);color:var(--bad);box-shadow:none;border:1px solid rgba(239,68,68,.25)}.wa{background:#25d366;color:#04210f;box-shadow:0 6px 20px rgba(37,211,102,.25)}
textarea.field{min-height:70px;resize:vertical;margin-top:12px}
#toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));max-width:520px;margin:0 auto;background:linear-gradient(135deg,var(--purple),#6d28d9);border-radius:14px;padding:14px 16px;z-index:100;font-weight:600;box-shadow:0 12px 36px rgba(0,0,0,.55),0 0 24px rgba(124,58,237,.35);animation:slide .3s ease}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="login-wrap">
    <img class="login-logo" src="/img/logo-hero.webp" alt="NS Garage Custom &amp; Detailing">
    <div class="login-tag">Agenda privada</div>
    <div class="card">
      <h1 class="display">Entrar</h1>
      <p class="sub">Acesso reservado.</p>
      <input id="email" class="field" type="email" placeholder="E-mail" autocomplete="username">
      <input id="pass" class="field" type="password" placeholder="Palavra-passe" autocomplete="current-password">
      <button class="btn" id="loginBtn">Entrar</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>
</div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand"><img src="/img/logo-nav.webp" alt="NS Garage"><span>Agenda</span></div>
    <div class="actions">
      <button class="icon-btn" id="pushBtn">🔔 Avisos</button>
      <button class="icon-btn" id="logoutBtn">Sair</button>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button class="tab active" data-tab="list">Lista</button>
    <button class="tab" data-tab="cal">Calendário</button>
  </div>
  <div id="filters" class="filters"></div>
  <main>
    <div id="listView"></div>
    <div id="calView" class="hidden"></div>
  </main>
</div>

<div id="sheet" class="hidden"><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://plnakzfuakruznxumblm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Rml0RR4dsT0XOcmKhZcTVw_ZqLazEg_';
const VAPID_PUBLIC_KEY = 'BLaW7doAy2LCgyB66UwKoJE6hdkqt8wm_ZqVoSfDR_cGcTgxjDph-saKlTuXuHtf7JJCgxy0AgWEIqnf4I9D6ek';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const STATUS = { pending:'Pendente', confirmed:'Confirmada', done:'Concluída', cancelled:'Cancelada' };
let rows = [], filter = 'active', view = 'list', calMonth = new Date(), calSel = null, seen = new Set(JSON.parse(localStorage.getItem('nsSeen') || '[]'));

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('pt-PT', { weekday:'short', day:'numeric', month:'short' }) : 'Sem data';
const endT = (t, d) => { const m = parseInt(t.slice(0,2))*60 + parseInt(t.slice(3,5)) + (d || 60); return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
const timeRange = r => r.booking_time ? r.booking_time.slice(0,5) + '–' + endT(r.booking_time, r.booking_duration) : '';
// Junta o indicativo do país quando o cliente só escreveu o número
function normPhone(p) {
  const raw = String(p || '').trim();
  let d = raw.replace(/[^\d]/g, '');
  if (raw.startsWith('+')) return d;            // já tem indicativo
  if (d.startsWith('00')) return d.slice(2);    // 00351...
  if (d.length === 9) return '351' + d;         // número português
  if (d.length === 10 || d.length === 11) return '55' + d;  // número brasileiro (DDD + número)
  return d;
}
const waLink = p => 'https://wa.me/' + normPhone(p);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); try { new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play(); } catch(e){} setTimeout(() => t.classList.add('hidden'), 5000); }

// ---------- auth ----------
async function init() {
  const { data } = await sb.auth.getSession();
  data.session ? start() : $('login').classList.remove('hidden');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
}
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  if (error) { $('loginErr').textContent = 'E-mail ou palavra-passe incorretos.'; return; }
  $('login').classList.add('hidden'); start();
};
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// ---------- data ----------
async function start() {
  $('app').classList.remove('hidden');
  await load();
  sb.channel('bookings-live').on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, p => {
    if (p.eventType === 'INSERT') toast('🔔 Nova marcação: ' + (p.new.name || ''));
    load();
  }).subscribe();
  updatePushBtn();
}
async function load() {
  const { data, error } = await sb.from('bookings').select('*').order('created_at', { ascending: false });
  if (error) { toast('Erro a carregar: ' + error.message); return; }
  rows = data; render();
}
async function setStatus(id, status) {
  const { error } = await sb.from('bookings').update({ status }).eq('id', id);
  if (error) {
    toast(error.code === '23P01' ? 'Não foi possível reativar: esse horário já está ocupado por outra marcação.' : 'Erro: ' + error.message);
    return;
  }
  await load(); openSheet(id);
}

// ---------- render ----------
function filtered() {
  if (filter === 'active') return rows.filter(r => r.status === 'pending' || r.status === 'confirmed');
  if (filter === 'all') return rows;
  return rows.filter(r => r.status === filter);
}
function renderFilters() {
  const opts = [['active','Ativas'],['pending','Pendentes'],['confirmed','Confirmadas'],['done','Concluídas'],['cancelled','Canceladas'],['all','Todas']];
  $('filters').classList.toggle('hidden', view !== 'list');
  $('filters').innerHTML = opts.map(([k,l]) => `<button class="chip ${filter===k?'active':''}" data-f="${k}">${l}</button>`).join('');
  $('filters').querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
}
function itemHTML(r) {
  const isNew = !seen.has(r.id) && r.status === 'pending';
  return `<div class="item st-${r.status}" data-id="${r.id}">
    <div class="top"><div><div class="name">${isNew ? '<span class="new-dot"></span>' : ''}${esc(r.name)}</div>
    <div class="meta">${esc(r.vehicle_detail || '')} · ${esc(r.vehicle_type || '')}</div>
    <div class="meta">${esc(r.services || '')}</div></div>
    <div class="when">${fmtDate(r.booking_date)}${r.booking_time ? ' · ' + timeRange(r) : ''}<br><span class="badge s-${r.status}">${STATUS[r.status]}</span></div></div>
    <div class="meta" style="margin-top:8px">💶 ${esc(r.total || '—')}</div></div>`;
}
function bindItems(root) { root.querySelectorAll('.item').forEach(el => el.onclick = () => openSheet(el.dataset.id)); }
function renderStats() {
  const todayS = new Date().toISOString().slice(0, 10);
  const in7 = new Date(Date.now() + 7*864e5).toISOString().slice(0, 10);
  const live = rows.filter(r => r.status === 'pending' || r.status === 'confirmed');
  const cells = [
    [rows.filter(r => r.status === 'pending').length, 'Pendentes'],
    [live.filter(r => r.booking_date === todayS).length, 'Hoje'],
    [live.filter(r => r.booking_date && r.booking_date >= todayS && r.booking_date <= in7).length, 'Próx. 7 dias']
  ];
  $('stats').innerHTML = cells.map(([n, l]) => `<div class="stat"><b>${n}</b><small>${l}</small></div>`).join('');
}
function renderList() {
  const list = filtered().slice().sort((a, b) => (a.booking_date || '9999').localeCompare(b.booking_date || '9999') || (a.booking_time || '').localeCompare(b.booking_time || '') || b.created_at.localeCompare(a.created_at));
  $('listView').innerHTML = list.length ? list.map(itemHTML).join('') : '<div class="empty">Sem marcações aqui.</div>';
  bindItems($('listView'));
}
function renderCal() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const live = rows.filter(r => r.status !== 'cancelled' && r.booking_date);
  const byDay = {}; live.forEach(r => (byDay[r.booking_date] = byDay[r.booking_date] || []).push(r));
  const todayS = new Date().toISOString().slice(0, 10);
  let h = `<div class="cal-head"><button class="icon-btn" id="pm">‹</button><div class="t">${calMonth.toLocaleDateString('pt-PT',{month:'long',year:'numeric'})}</div><button class="icon-btn" id="nm">›</button></div><div class="cal-grid">`;
  h += ['S','T','Q','Q','S','S','D'].map(d => `<div class="dn">${d}</div>`).join('');
  for (let i = 0; i < first; i++) h += '<div class="day empty"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, n = (byDay[ds] || []).length;
    h += `<button class="day ${ds===todayS?'today':''} ${ds===calSel?'sel':''}" data-d="${ds}">${d}${n ? `<span class="dot">●${n>1?n:''}</span>` : ''}</button>`;
  }
  h += '</div><div style="margin-top:16px" id="dayList"></div>';
  $('calView').innerHTML = h;
  $('pm').onclick = () => { calMonth = new Date(y, m - 1, 1); renderCal(); };
  $('nm').onclick = () => { calMonth = new Date(y, m + 1, 1); renderCal(); };
  $('calView').querySelectorAll('.day[data-d]').forEach(b => b.onclick = () => { calSel = b.dataset.d; renderCal(); });
  if (calSel) { const l = byDay[calSel] || []; $('dayList').innerHTML = `<div class="meta" style="margin-bottom:8px">${fmtDate(calSel)}</div>` + (l.length ? l.map(itemHTML).join('') : '<div class="empty">Dia livre.</div>'); bindItems($('dayList')); }
}
function render() {
  renderStats();
  renderFilters();
  $('listView').classList.toggle('hidden', view !== 'list');
  $('calView').classList.toggle('hidden', view !== 'cal');
  view === 'list' ? renderList() : renderCal();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  view = t.dataset.tab; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t)); render();
});

// ---------- detail sheet ----------
function openSheet(id) {
  const r = rows.find(x => x.id === id); if (!r) return;
  seen.add(id); localStorage.setItem('nsSeen', JSON.stringify([...seen]));
  const line = (k, v) => v ? `<div class="row"><span>${k}</span><span>${esc(v)}</span></div>` : '';
  $('sheetBody').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2 style="font-size:1.15rem">${esc(r.name)}</h2><button class="icon-btn" id="closeSheet">✕</button></div>
    <span class="badge s-${r.status}">${STATUS[r.status]}</span>
    <div style="margin-top:10px">
    ${line('Data', fmtDate(r.booking_date))}${line('Horário', timeRange(r))}${line('Serviços', r.services)}${line('Opção', r.service_options)}${line('Veículo', (r.vehicle_detail||'') + (r.vehicle_type ? ' (' + r.vehicle_type + ')' : ''))}
    ${line('Total estimado', r.total)}${line('Morada', r.address)}${line('Telefone', r.phone)}${line('E-mail', r.email)}${line('Notas do cliente', r.notes)}
    ${line('Recebida', new Date(r.created_at).toLocaleString('pt-PT'))}</div>
    <textarea class="field" id="pn" placeholder="Notas privadas (só tu vês)">${esc(r.private_notes || '')}</textarea>
    <button class="btn sec" id="savePn">Guardar notas</button>
    <div class="grid2">
      <a class="btn wa" style="text-align:center;text-decoration:none" href="${waLink(r.phone)}" target="_blank">WhatsApp</a>
      <a class="btn sec" style="text-align:center;text-decoration:none" href="tel:+${normPhone(r.phone)}">Ligar</a>
      ${r.status !== 'confirmed' ? '<button class="btn ok" id="bConf">Confirmar</button>' : '<button class="btn sec" id="bPend">Voltar a pendente</button>'}
      <button class="btn ok" id="bDone" style="background:var(--bg3);border:1px solid var(--ok);color:var(--ok)">Concluir</button>
      <button class="btn bad" id="bCan">Recusar / Cancelar</button>
      <button class="btn bad" id="bDel">Apagar</button>
    </div>`;
  $('sheet').classList.remove('hidden');
  $('closeSheet').onclick = closeSheet;
  $('savePn').onclick = async () => { await sb.from('bookings').update({ private_notes: $('pn').value }).eq('id', id); toast('Notas guardadas'); await load(); };
  if ($('bConf')) $('bConf').onclick = () => setStatus(id, 'confirmed');
  if ($('bPend')) $('bPend').onclick = () => setStatus(id, 'pending');
  $('bDone').onclick = () => setStatus(id, 'done');
  $('bCan').onclick = () => setStatus(id, 'cancelled');
  $('bDel').onclick = async () => { if (confirm('Apagar esta marcação definitivamente?')) { await sb.from('bookings').delete().eq('id', id); closeSheet(); load(); } };
  render();
}
function closeSheet() { $('sheet').classList.add('hidden'); render(); }
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });

// ---------- push ----------
const urlB64 = b => { const p = '='.repeat((4 - b.length % 4) % 4), s = (b + p).replace(/-/g, '+').replace(/_/g, '/'), r = atob(s); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
async function updatePushBtn() {
  const b = $('pushBtn');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { b.textContent = '🔕 Sem avisos'; return; }
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); b.textContent = sub ? '🔔 Avisos ligados' : '🔔 Ativar avisos'; } catch (e) {}
}
$('pushBtn').onclick = async () => {
  if (!('PushManager' in window)) { alert('No iPhone, primeiro adicione esta página ao Ecrã Principal (Partilhar → Adicionar ao Ecrã Principal) e abra pelo ícone.'); return; }
  if (!VAPID_PUBLIC_KEY) { alert('As notificações push ainda não estão configuradas.'); return; }
  const perm = await Notification.requestPermission(); if (perm !== 'granted') return;
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(VAPID_PUBLIC_KEY) });
  const j = sub.toJSON();
  await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, subscription: j }, { onConflict: 'endpoint' });
  toast('Avisos ligados neste dispositivo'); updatePushBtn();
};

init();
</script>
